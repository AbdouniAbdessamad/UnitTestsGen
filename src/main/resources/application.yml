spring:
  application:
    name: testgen-ai
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen2.5-coder:7b   # ollama pull qwen2.5-coder:7b
          temperature: 0.2

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
