<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestGen AI – Générateur de tests JUnit</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#4f46e5; --border:#e5e7eb; --ok:#059669; --ko:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1b1e24; --text:#e8e9ec; --muted:#9aa0aa; --border:#2c3038; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 28px; border-bottom:1px solid var(--border); background:var(--card); }
  header h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; color:var(--muted); font-size:14px; }
  main { display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:20px 28px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
  h2 { margin:0 0 10px; font-size:15px; }
  textarea { width:100%; height:420px; font:13px/1.45 ui-monospace,Consolas,monospace; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; resize:vertical; }
  .row { display:flex; gap:12px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; }
  button.secondary { background:transparent; color:var(--text); border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:wait; }
  input[type=text] { flex:1; min-width:180px; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  .meta { font-size:13px; color:var(--muted); margin-top:8px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; color:#fff; }
  .ok { background:var(--ok); } .ko { background:var(--ko); }
</style>
</head>
<body>
<header>
  <h1>TestGen AI</h1>
  <p>Colle une classe Java, récupère des tests JUnit 5 générés par un LLM local (Ollama). <a href="/swagger-ui.html">Swagger</a></p>
</header>
<main>
  <section class="card">
    <h2>Classe Java</h2>
    <textarea id="src" placeholder="package com.example; public class MaClasse { ... }"></textarea>
    <div class="row">
      <label><input type="checkbox" id="mockito" checked> Mockito</label>
      <input type="text" id="instr" placeholder="Consignes supplémentaires (optionnel)">
    </div>
    <div class="row">
      <button id="go">Générer les tests</button>
      <input type="file" id="file" accept=".java">
    </div>
  </section>
  <section class="card">
    <h2>Tests JUnit générés</h2>
    <textarea id="out" readonly></textarea>
    <div class="row">
      <button class="secondary" id="copy">Copier</button>
      <button class="secondary" id="dl">Télécharger .java</button>
    </div>
    <div class="meta" id="meta"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
let testName = "GeneratedTest";

$("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (f) $("src").value = await f.text();
});

$("go").addEventListener("click", async () => {
  $("go").disabled = true; $("out").value = ""; $("meta").textContent = "Génération en cours (peut prendre quelques dizaines de secondes)…";
  try {
    const res = await fetch("/api/v1/tests/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sourceCode: $("src").value, useMockito: $("mockito").checked, additionalInstructions: $("instr").value || null })
    });
    const data = await res.json();
    if (!res.ok) { $("meta").textContent = "Erreur : " + (data.detail || res.status); return; }
    testName = data.testClassName;
    $("out").value = data.testCode;
    const badge = data.syntaxValid ? '<span class="badge ok">syntaxe valide</span>' : '<span class="badge ko">syntaxe invalide</span>';
    $("meta").innerHTML = `${badge} · ${data.methodsDetected.length} méthode(s) détectée(s) · ${data.attempts} tentative(s) · ${(data.durationMs/1000).toFixed(1)} s · modèle ${data.model}`;
  } catch (err) {
    $("meta").textContent = "Erreur réseau : " + err.message;
  } finally { $("go").disabled = false; }
});

$("copy").addEventListener("click", () => navigator.clipboard.writeText($("out").value));
$("dl").addEventListener("click", () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([$("out").value], { type: "text/x-java-source" }));
  a.download = testName + ".java"; a.click();
});
</script>
</body>
</html>
